# Cloudflare Worker des compteurs agrégés — NE PAS déployer avant validation RGPD (docs/statistiques.md)
name = "fmm-compteurs"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Pas de journaux : le Worker ne doit rien conserver des requêtes
[observability]
enabled = false

[triggers]
crons = ["15 2 * * *"]   # tous les jours vers 3h15 / 4h15 (heure de Paris)

[vars]
SITE_URL = "https://julio06200.github.io/find-my-meeting/"
UMAMI_ENDPOINT = "https://gateway.umami.is/api/batch"
UMAMI_WEBSITE = ""       # identifiant du site Umami
K_MIN = "5"

[[d1_databases]]
binding = "DB"
database_name = "fmm-compteurs"
database_id = ""         # rempli après `wrangler d1 create fmm-compteurs`
